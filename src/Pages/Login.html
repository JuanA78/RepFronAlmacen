<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Almacén HT - Acceso al Sistema</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  
  <style>
    body {
      background-color: #232730;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    .login-container {
      background: #ffffff;
      border-radius: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      max-width: 900px;
      width: 100%;
    }

    .login-banner {
      background: linear-gradient(135deg, #dc3545 0%, #800f1d 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 3rem 2rem;
      position: relative;
    }

    .login-banner::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.2) 100%);
    }

    .brand-icon-box {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .input-group-text {
      background-color: #f8fafc;
      border-right: none;
      color: #64748b;
    }

    .form-control {
      background-color: #f8fafc;
      border-left: none;
      padding: 0.75rem 1rem;
    }

    .form-control:focus {
      background-color: #ffffff;
      box-shadow: none;
      border-color: #cbd5e1;
    }

    .input-group:focus-within {
      box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.15);
      border-radius: 0.375rem;
    }

    .btn-submit {
      background: linear-gradient(135deg, #dc3545 0%, #b02a37 100%);
      border: none;
      padding: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(220, 53, 69, 0.35);
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">

  <div class="login-container">
    <div class="row g-0">
      
      <!-- Lateral Ilustrativo -->
      <div class="col-md-5 login-banner text-center">
        <div class="brand-icon-box mb-3">
          <i class="fas fa-boxes-stacked fa-2x text-white"></i>
        </div>
        <h3 class="fw-bold z-1 mb-1">Almacén</h3>
        <p class="small text-white-50 z-1 mb-0">Sistema Integral de Inventario</p>
      </div>

      <!-- Formulario de Acceso -->
      <div class="col-md-7 p-4 p-lg-5 bg-white">
        <div class="mb-4">
          <h4 class="fw-bold text-dark mb-1">Bienvenido de nuevo</h4>
          <p class="text-muted small">Ingresa tus credenciales para continuar</p>
        </div>

        <div id="alertMessage" class="alert alert-danger d-none py-2 small" role="alert">
          <i class="fas fa-exclamation-circle me-2"></i><span id="alertText"></span>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label text-secondary small fw-bold">USUARIO</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-user"></i></span>
              <input type="text" id="username" class="form-control" placeholder="Nombre de usuario" required />
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">CONTRASEÑA</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fas fa-lock"></i></span>
              <input type="password" id="password" class="form-control" placeholder="••••••••" required />
            </div>
          </div>

          <button type="submit" id="btnSubmit" class="btn btn-danger btn-submit w-100 rounded-3 text-white mb-3">
            <span id="btnText"><i class="fas fa-sign-in-alt me-2"></i>Ingresar</span>
          </button>
        </form>

        <div class="text-center mt-4">
          <small class="text-muted">© 2026 Almacén HT · Todos los derechos reservados</small>
        </div>
      </div>

    </div>
  </div>


  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const usuario = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const alertMessage = document.getElementById('alertMessage');
      const alertText = document.getElementById('alertText');

      alertMessage.classList.add('d-none');

      try {
        const response = await fetch('https://apisalmacenht.onrender.com/api/usuarios/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, password })
        });

        const data = await response.json();

            if (response.ok) {

        localStorage.setItem('userSession', JSON.stringify({
          id: data.usuario.id,
          nombre: data.usuario.nombre,
          usuario: data.usuario.usuario,
          rol: data.usuario.rol,
          token: data.token
        }));

        window.location.href = '../../index.html';

      } else {

        alertText.innerText = data.message || 'Credenciales incorrectas';
        alertMessage.classList.remove('d-none');
      }
      } catch (err) {
        alertText.innerText = 'Sin respuesta del servidor';
        alertMessage.classList.remove('d-none');
      }
    });
  </script>

</body>
</html>
